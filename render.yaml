services:
  - type: web
    name: ai-hub-pro-knowledge-v21-free
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: AI_PROVIDER
        value: auto
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_SEARCH_DEPTH
        value: basic
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: KNOWLEDGE_CACHE_SECONDS
        value: 0
      - key: KNOWLEDGE_CONNECTOR_TIMEOUT_MS
        value: 15000
      - key: KNOWLEDGE_VERIFY_SOURCES
        value: 12
      - key: KNOWLEDGE_MAX_SOURCES
        value: 12
      - key: AI_PROVIDER_TIMEOUT_MS
        value: 30000
      - key: AI_MAX_OUTPUT_TOKENS
        value: 1800
